global
    log stdout format raw local0
    maxconn 256
defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s
# клиенты стучатся сюда
frontend fe_tcp
    bind *:8080
    mode tcp
    default_backend be_servers
# балансировка Round-robin на 4 уровне
backend be_servers
    mode tcp
    balance roundrobin
    server s1 127.0.0.1:8001 check
    server s2 127.0.0.1:8002 check
