global
    log stdout format raw local0
    maxconn 256
defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
frontend fe_http
    bind *:8080
    mode http
    # Host: example.local или example.local:8080
    acl is_example hdr(host) -i example.local example.local:8080
    use_backend be_weighted if is_example
    default_backend be_other
# weighted round-robin: веса 2, 3, 4
backend be_weighted
    mode http
    balance roundrobin
    server s1 127.0.0.1:8001 weight 2 check
    server s2 127.0.0.1:8002 weight 3 check
    server s3 127.0.0.1:8003 weight 4 check
# запросы НЕ на example.local
backend be_other
    mode http
    http-request deny status 403
